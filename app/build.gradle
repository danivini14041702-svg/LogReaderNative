// Arquivo da pasta APP. Aqui a gente adiciona as bibliotecas.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.nativelogreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.nativelogreader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    // Essas são as novas bibliotecas para o Tema Claro/Escuro e Menu Lateral
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
